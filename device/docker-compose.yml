# Run this on your own PC to join Cardea as a client that keeps your secrets locally.
#
#   HUB_URL=http://<EC2_PUBLIC_IP>:5000 docker compose up -d --build
#
# Then open http://localhost:5001 and click "Register device".
# The UI is only open on localhost, so secrets sent to you arrive through the hub relay (memory only).

services:
  agent:
    build: ../agent
    environment:
      HUB_URL: ${HUB_URL}
      DEVICE_NAME: ${DEVICE_NAME:-my-pc}
      PUBLIC_PORT: "5001"
      PORT: "5001"
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - vault:/data
    restart: unless-stopped

volumes:
  vault:
