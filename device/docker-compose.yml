# Run this on a second device (your laptop / another machine) to join Cardea.
#
#   HUB_URL=http://<EC2_PUBLIC_IP>:5000 MY_IP=<this device's reachable IP> docker compose up -d --build
#
# Then open http://localhost:5001 and click "Register device".
# Other devices send secrets straight to MY_IP:5001, so that port must be reachable.

services:
  agent:
    build: ../agent
    environment:
      HUB_URL: ${HUB_URL}
      DEVICE_NAME: ${DEVICE_NAME:-my-laptop}
      PUBLIC_IP: ${MY_IP}
      PUBLIC_PORT: "5001"
      PORT: "5001"
    ports:
      - "5001:5001"
    volumes:
      - vault:/data
    restart: unless-stopped

volumes:
  vault:
