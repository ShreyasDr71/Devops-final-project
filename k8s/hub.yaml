# The hub: pairing, contacts, groups, audit log and the in-memory secret relay
# Blue-green: k8s/blue-green.sh fills in __COLOR__ (the idle colour that gets this build)
# and __LIVE_COLOR__ (the colour the public Service keeps pointing at until the switch).
---
# hub.db (devices, pairings, groups, audit) survives restarts and redeploys.
# Shared by hub-blue and hub-green: on a single node a ReadWriteOnce volume can be mounted by both.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hub-data
  namespace: cardea
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-__COLOR__
  namespace: cardea
spec:
  # One copy per colour: pairing PINs and the secret relay live in the hub's memory
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: hub, color: __COLOR__ }
  template:
    metadata:
      labels: { app: hub, color: __COLOR__ }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: hub
          image: 127.0.0.1:5050/cardea-hub:__IMAGE_TAG__
          env:
            # The root filesystem is read-only; gunicorn keeps its control socket under $HOME
            - { name: HOME, value: /tmp }
            # Shown by /health so you can see which colour and build is answering
            - { name: COLOR, value: __COLOR__ }
            - { name: BUILD, value: "__IMAGE_TAG__" }
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: hub-data }
        - name: tmp
          emptyDir: {}
---
# LoadBalancer = k3s opens port 5000 on the server itself, so devices keep using http://SERVER_IP:5000.
# Only the live colour gets this traffic; blue-green.sh switches the colour after testing the idle one.
apiVersion: v1
kind: Service
metadata:
  name: hub
  namespace: cardea
spec:
  type: LoadBalancer
  selector: { app: hub, color: __LIVE_COLOR__ }
  ports:
    - port: 5000
      targetPort: 5000
---
# Internal address of the idle colour, used to test a new build before it gets real traffic
apiVersion: v1
kind: Service
metadata:
  name: hub-preview
  namespace: cardea
spec:
  type: ClusterIP
  selector: { app: hub, color: __COLOR__ }
  ports:
    - port: 5000
      targetPort: 5000
