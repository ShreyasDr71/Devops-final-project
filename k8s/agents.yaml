# Two demo devices running on the server: device-A on :5001 and device-B on :5002
# Blue-green like the hub: each device has a -blue and a -green Deployment sharing one volume.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-a-data
  namespace: cardea
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-a-__COLOR__
  namespace: cardea
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: agent-a, color: __COLOR__ }
  template:
    metadata:
      labels: { app: agent-a, color: __COLOR__ }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: agent
          image: 127.0.0.1:5050/cardea-agent:__IMAGE_TAG__
          env:
            - { name: HUB_URL, value: "http://hub:5000" }
            - { name: DEVICE_NAME, value: device-A }
            - { name: PUBLIC_IP, value: "__SERVER_IP__" }
            - { name: PUBLIC_PORT, value: "5001" }
            - { name: PORT, value: "5001" }
            - { name: HOME, value: /tmp }  # read-only root filesystem; gunicorn writes under $HOME
            - { name: COLOR, value: __COLOR__ }  # shown by /health
            - { name: BUILD, value: "__IMAGE_TAG__" }
          ports:
            - containerPort: 5001
          readinessProbe:
            httpGet: { path: /health, port: 5001 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5001 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: agent-a-data }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-a
  namespace: cardea
spec:
  type: LoadBalancer
  selector: { app: agent-a, color: __LIVE_COLOR__ }
  ports:
    - port: 5001
      targetPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: agent-a-preview
  namespace: cardea
spec:
  type: ClusterIP
  selector: { app: agent-a, color: __COLOR__ }
  ports:
    - port: 5001
      targetPort: 5001
---
