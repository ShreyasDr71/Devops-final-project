# Used only on EC2: sends the hub's audit logs to CloudWatch Logs.
# The EC2 IAM role (created by Terraform) gives permission to write logs.
services:
  hub:
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-ap-south-1}
        awslogs-group: /cardea/hub
        awslogs-create-group: "false"
