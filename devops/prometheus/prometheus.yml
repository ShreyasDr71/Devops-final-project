global:
  scrape_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  # Cardea runs in Kubernetes (k3s); its LoadBalancer services listen on the server's ports
  - job_name: cardea-hub
    static_configs:
      - targets: ["host.docker.internal:5000"]

  - job_name: cardea-devices
    static_configs:
      - targets: ["host.docker.internal:5001", "host.docker.internal:5002"]

  - job_name: jenkins
    metrics_path: /prometheus/
    static_configs:
      - targets: ["jenkins:8080"]

  - job_name: server
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]
