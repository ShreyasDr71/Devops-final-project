# DevOps tools stack, started on the EC2 server by Ansible.
services:
  jenkins:
    build: ./jenkins
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      # Same path on host and in container, so "docker run -v $WORKSPACE:..." works from pipelines
      - /var/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID}"
    restart: unless-stopped

  sonarqube:
    image: sonarqube:10.7.0-community
    ports:
      - "9000:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
    restart: unless-stopped

  # ---------- Monitoring ----------

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  # Server metrics (CPU, memory, disk)
  node-exporter:
    image: prom/node-exporter:v1.8.2
    pid: host
    volumes:
      - /:/host:ro,rslave
    command: --path.rootfs=/host
    restart: unless-stopped

  # Per-container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped

volumes:
  sonar-data:
  sonar-extensions:
  prometheus-data:
  grafana-data:

# Created by Ansible; the app stack joins the same network
networks:
  default:
    name: devops
    external: true
